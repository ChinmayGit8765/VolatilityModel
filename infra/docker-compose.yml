# VolForecast local infrastructure stack
#
# Services:
#   postgres       — shared Postgres 16 backend for MLflow and Prefect metadata stores
#   mlflow-server  — MLflow 3 tracking server + model registry (port 5000)
#   prefect-server — Prefect 3 orchestration server (port 4200)
#   prefect-worker — Prefect worker polling the local-pool work pool
#
# Named volumes (never bind mounts — avoids SQLite-on-NTFS locking failures on Windows):
#   postgres_data     — Postgres data directory
#   mlflow_artifacts  — MLflow artifact store
#
# Usage:
#   cp infra/.env.example infra/.env   # then edit with real credentials
#   docker compose -f infra/docker-compose.yml up -d
#   # MLflow UI: http://localhost:5000
#   # Prefect UI: http://localhost:4200
#
# Security posture (local single-machine dev stack):
#   - All published ports bind to 127.0.0.1 only — on Windows, Docker Desktop
#     forwards published ports through the host firewall, so a plain
#     "5433:5432" binding would expose unauthenticated services to the LAN.
#   - POSTGRES_PASSWORD has NO default: the stack refuses to start unless it is
#     set in infra/.env, so the documented "edit with real credentials" step is
#     enforced rather than silently falling back to a known default.

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volforecast}
      # No fallback: fail loudly if infra/.env was never created (WR-05)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mlflowdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run on first start (creates prefectdb alongside mlflowdb)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-volforecast} -d ${POSTGRES_DB:-mlflowdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Host port 5433 to avoid conflict with other local Postgres instances.
    # MLflow and Prefect communicate with postgres on port 5432 via the Docker network,
    # so this binding only affects host-side access (e.g., psql, debugging tools).
    # Loopback-only: never expose Postgres to the LAN (WR-05).
    ports:
      - "127.0.0.1:5433:5432"

  mlflow-server:
    # Custom image: upstream MLflow image + pinned psycopg2-binary baked in at
    # build time, so startup never depends on PyPI (WR-06). See mlflow/Dockerfile.
    build:
      context: ./mlflow
    image: volforecast-mlflow:v3.13.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only: MLflow has no authentication (WR-05).
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Synchronous psycopg2 URI for MLflow (no +asyncpg)
      MLFLOW_BACKEND_STORE_URI: "postgresql://${POSTGRES_USER:-volforecast}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-mlflowdb}"
      # MLflow 3.x security middleware: allow connections from Docker host.
      # MLFLOW_ALLOWED_HOSTS is not a supported env var; use --allowed-hosts flag via entrypoint script.
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./mlflow-entrypoint.sh:/mlflow-entrypoint.sh:ro
    command: ["bash", "/mlflow-entrypoint.sh"]

  prefect-server:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only: the Prefect API is unauthenticated (WR-05).
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      # asyncpg URI for Prefect (separate DB from MLflow — prefectdb vs mlflowdb)
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${POSTGRES_USER:-volforecast}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/prefectdb"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_UI_API_URL: "http://localhost:4200/api"
    command: prefect server start

  prefect-worker:
    # Built from the project image (same deps + prefect as api/dashboard) so the
    # process worker's flow subprocess (sys.executable) has volforecast + pandas +
    # lightgbm + mlflow + arch + evidently available. The base prefecthq/prefect
    # image lacks these, so every daily-flow task would crash on import.
    build:
      context: ..
      dockerfile: infra/prefect-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - prefect-server
      # forecast_task calls the serving API over the compose network — the api
      # service must be up (audit BLOCKER-1 fix).
      - api
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"
      # Worker needs MLFLOW_TRACKING_URI so retrain_task can register models
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
      # VOLFORECAST_ROOT tells volforecast.config.project_root() where the repo is
      # mounted inside the container (must match the volumes entry below).
      VOLFORECAST_ROOT: "/repo"
      # Data dir is bind-mounted at /repo/data (matches the volumes entry below),
      # so data resolution must point there, not the image-default /data.
      VOLFORECAST_DATA_ROOT: "/repo/data"
      # forecast_task hits GET {VOLFORECAST_API_URL}/forecast so the daily flow
      # generates live forecasts through the REAL serving path (audit BLOCKER-1).
      VOLFORECAST_API_URL: "http://api:8000"
    # --type process makes Prefect 3 auto-create the work pool on first start.
    # Without it, the worker errors out because nothing else creates local-pool,
    # and restart: unless-stopped turns that into a crash loop.
    command: uv run --no-sync prefect worker start --pool local-pool --type process
    volumes:
      # Code-visibility mount (T-04-18 / Assumption A4 / Pitfall 4):
      # A local-process work pool runs the flow entrypoint as a subprocess on the
      # worker's local filesystem.  Without this bind-mount, flow.from_source() with
      # source=<local path> cannot resolve "pipelines/daily_pipeline.py:daily_flow"
      # because the worker container has no access to the repo directory.
      #
      # The source path recorded by create_deployment.py (repo root on the HOST)
      # must be accessible inside the container at the same relative path as
      # VOLFORECAST_ROOT (/repo).  The worker then finds the entrypoint at
      # /repo/pipelines/daily_pipeline.py.
      #
      # Security posture: bind-mounts the project's own repo directory (read-only
      # code + config) and the data directory.  No new port is published; loopback-
      # only posture unchanged (T-04-17).
      - ..:/repo:ro          # repo root → /repo (read-only: code + config)
      - ../data:/repo/data   # data/ is rw: ingest writes raw, labeller writes FVR

  api:
    # Serving image: python:3.12-slim + libgomp1 (required by LightGBM) + uv sync
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    # Wait for MLflow to be started before bringing up the API.
    # mlflow-server has no healthcheck so we use service_started (Pattern 9).
    depends_on:
      mlflow-server:
        condition: service_started
    # Loopback-only: matches the security posture of the rest of the stack (T-03-12).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # API container reaches MLflow via compose internal DNS (not localhost)
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
      # Prediction log written to the bind-mounted data volume (Pitfall 7)
      PREDICTION_LOG_PATH: "/data/predictions/predictions.parquet"
      # Data root for processed parquets (bind-mounted at /data)
      VOLFORECAST_DATA_ROOT: "/data"
    volumes:
      # Bind-mount the host data/ dir so the container can:
      #   - READ:  data/processed/ + data/features/ for feature computation
      #   - WRITE: data/predictions/predictions.parquet (Phase 4 log contract)
      # Note: NO mlflow_artifacts mount needed — Plan 03-01 enables --serve-artifacts
      # proxy mode so the tracking server proxies artifacts over HTTP (Pitfall 4 resolved).
      - ../data:/data

  dashboard:
    # Observability dashboard: python:3.12-slim + libgomp1 + uv sync + Streamlit 1.58.0
    # Mirrors the api service pattern (slim + libgomp1 + split uv-sync + non-root user).
    build:
      context: ..
      dockerfile: infra/dashboard/Dockerfile
    restart: unless-stopped
    # Wait for mlflow-server and api to start before the dashboard tries to query them.
    # Neither has a healthcheck, so service_started is the correct condition (Pattern 9).
    depends_on:
      mlflow-server:
        condition: service_started
      api:
        condition: service_started
    # Loopback-only: dashboard has no authentication; consistent with api/mlflow/prefect
    # security posture (T-05-01).
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      # Dashboard reads champion metadata from MLflow via compose internal DNS
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
      # Dashboard probes the API /health endpoint via compose internal DNS
      API_BASE_URL: "http://api:8000"
      # Data root: bind-mounted at /data (read-only by design — dashboard never writes)
      VOLFORECAST_DATA_ROOT: "/data"
    volumes:
      # Bind-mount the host data/ dir so the dashboard can read:
      #   - data/monitoring/forecast_vs_realized.parquet (FVR panel)
      #   - data/monitoring/{date}_drift.json + .html (drift panel)
      #   - data/predictions/predictions.parquet (service stats panel)
      # Security posture: the dashboard code is read-only by design (T-05-02).
      # The non-root appuser (uid 1000) runs inside, matching the api Dockerfile (T-05-04).
      - ../data:/data

volumes:
  postgres_data:
  mlflow_artifacts:
